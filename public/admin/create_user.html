<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
</head>
<body>

<form id="create-form">
    <label for="email">E-Mail:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Passwort:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <input type="submit" value="Nutzer anlegen">
</form>

<div id="feedback"></div>

<script type="module">
import { api } from '../assets/js/api.js';

const form     = document.getElementById('create-form');
const feedback = document.getElementById('feedback');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    feedback.innerHTML = '';

    const email    = form.email.value.trim();
    const password = form.password.value;

    if (!email || !password) {
        showFeedback('error', 'E-Mail und Passwort sind erforderlich.');
        return;
    }

    try {
        const createResponse = await api.post('/ajax/users/create.php', { email, password });

        if (createResponse.success && createResponse.user_id) {
            const verification = await api.get('/ajax/users.php', { id: createResponse.user_id });

            if (verification.success) {
                showFeedback('success', `Nutzer erfolgreich angelegt (ID: ${parseInt(createResponse.user_id)}).`);
                form.reset();
            } else {
                showFeedback('error', 'Datensatz angelegt, aber Verifikation fehlgeschlagen.');
            }
        } else {
            showFeedback('error', createResponse.error ?? 'Unbekannter Fehler.');
        }
    } catch (e) {
        showFeedback('error', 'API nicht erreichbar.');
    }
});

function showFeedback(type, message) {
    feedback.innerHTML = `<div style="color: ${type === 'success' ? 'green' : 'red'};">${escHtml(message)}</div>`;
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>

</body>
</html>
