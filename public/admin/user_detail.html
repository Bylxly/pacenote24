<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>User Detail</title>
</head>
<body>

<a href="adminpanel.html">← Zurück zur Übersicht</a>

<div id="success-msg" style="color: green;"></div>
<div id="error-msg" style="color: red;"></div>

<div id="page-content"></div>

<script type="module">
import { api } from '../assets/js/api.js';

const successMsg  = document.getElementById('success-msg');
const errorMsg    = document.getElementById('error-msg');
const pageContent = document.getElementById('page-content');

const params = new URLSearchParams(location.search);
const userId = parseInt(params.get('id'));

if (!userId || isNaN(userId)) {
    document.body.innerHTML = 'Ungültige User-ID.';
    throw new Error('Invalid user ID');
}

let user, allGroups, memberships;
try {
    const [userRes, groupsRes, membersRes] = await Promise.all([
        api.get('/ajax/users.php',         { id: userId }),
        api.get('/ajax/groups.php'),
        api.get('/ajax/group-members.php', { user_id: userId }),
    ]);

    if (!userRes.success) {
        document.body.innerHTML = 'Nutzer nicht gefunden.';
        throw new Error('User not found');
    }

    user        = userRes.data;
    allGroups   = groupsRes.data  ?? [];
    memberships = membersRes.data ?? [];
} catch (e) {
    document.body.innerHTML = 'API nicht erreichbar.';
    throw e;
}

renderPage();

function validatePassword(password) {
    if (password.length < 8)             return 'Passwort muss mindestens 8 Zeichen lang sein.';
    if (!/[^A-Za-z0-9]/.test(password))  return 'Passwort muss mindestens ein Sonderzeichen enthalten.';
    return null;
}

function renderPage() {
    const memberGroupIds = new Set(memberships.map(m => m.group_id));

    const groupOptions = allGroups
        .filter(g => !memberGroupIds.has(g.group_id))
        .map(g => `<option value="${parseInt(g.group_id)}">${escHtml(g.name)}</option>`)
        .join('');

    const memberRows = memberships.map(m => {
        const group = allGroups.find(g => g.group_id === m.group_id);
        return `
            <tr>
                <td>${escHtml(String(m.group_id))}</td>
                <td>${escHtml(group?.name ?? '—')}</td>
                <td>
                    <button type="button" data-groupid="${parseInt(m.group_id)}" class="remove-group">
                        Entfernen
                    </button>
                </td>
            </tr>`;
    }).join('');

    pageContent.innerHTML = `
        <h2>Profil verwalten</h2>
        <form id="update-form">
            <label>User ID:</label><br>
            <input type="text" value="${escHtml(String(user.user_id))}" disabled><br>

            <label>E-Mail Adresse:</label><br>
            <input type="email" name="email" value="${escHtml(user.email)}" required><br><br>

            <label>Passwort (leer lassen = unverändert):</label><br>
            <input type="password" name="password"><br><br>

            <button type="submit" name="update">Speichern</button>
        </form>

        <hr>

        <h3>Gruppen</h3>
        <table border="1" cellpadding="8" style="border-collapse: collapse; font-family: sans-serif;">
            <thead style="background-color: #f2f2f2;">
                <tr><th>Group ID</th><th>Name</th><th>Action</th></tr>
            </thead>
            <tbody id="groups-tbody">
                ${memberRows || '<tr><td colspan="3">Keine Gruppenmitgliedschaften.</td></tr>'}
            </tbody>
        </table>
        <br>
        <form id="add-group-form">
            <select name="group_id" ${groupOptions ? '' : 'disabled'}>
                ${groupOptions || '<option>Alle Gruppen bereits zugewiesen</option>'}
            </select>
            <button type="submit" ${groupOptions ? '' : 'disabled'}>Gruppe hinzufügen</button>
        </form>

        <hr>

        <h3>Gefahrenbereich</h3>
        <p>Das Löschen eines Nutzers kann nicht rückgängig gemacht werden.</p>
        <form id="delete-form">
            <button type="submit" name="delete_user">Nutzer unwiderruflich löschen</button>
        </form>
    `;

    document.getElementById('update-form').addEventListener('submit', handleUpdate);
    document.getElementById('add-group-form').addEventListener('submit', handleAddGroup);
    document.getElementById('delete-form').addEventListener('submit', handleDelete);

    document.querySelectorAll('.remove-group').forEach(btn => {
        btn.addEventListener('click', () => handleRemoveGroup(parseInt(btn.dataset.groupid)));
    });
}

async function handleUpdate(e) {
    e.preventDefault();
    clearMessages();

    const email    = e.target.email.value.trim();
    const password = e.target.password.value;

    if (password) {
        const pwError = validatePassword(password);
        if (pwError) {
            errorMsg.textContent = pwError;
            return;
        }
    }

    const payload = { id: userId, email };
    if (password) payload.password = password;

    try {
        const update = await api.post('/ajax/users/update.php', payload);
        if (update.success) {
            successMsg.textContent = 'Profil erfolgreich aktualisiert.';
            e.target.password.value = '';
        } else {
            errorMsg.textContent = update.error ?? 'Aktualisierung fehlgeschlagen.';
        }
    } catch (e) {
        errorMsg.textContent = 'API-Kommunikationsfehler: ' + e.message;
    }
}

async function handleAddGroup(e) {
    e.preventDefault();
    clearMessages();

    const groupId = parseInt(e.target.group_id.value);

    try {
        const res = await api.post('/ajax/group-members/create.php', {
            user_id:  userId,
            group_id: groupId,
        });

        if (res.success) {
            memberships.push({ user_id: userId, group_id: groupId });
            renderPage();
            successMsg.textContent = 'Gruppe hinzugefügt.';
        } else {
            errorMsg.textContent = res.error ?? 'Hinzufügen fehlgeschlagen.';
        }
    } catch (e) {
        errorMsg.textContent = 'API-Kommunikationsfehler: ' + e.message;
    }
}

async function handleRemoveGroup(groupId) {
    clearMessages();

    try {
        const res = await api.post('/ajax/group-members/delete.php', {
            user_id:  userId,
            group_id: groupId,
        });

        if (res.success) {
            memberships = memberships.filter(m => m.group_id !== groupId);
            renderPage();
            successMsg.textContent = 'Gruppe entfernt.';
        } else {
            errorMsg.textContent = res.error ?? 'Entfernen fehlgeschlagen.';
        }
    } catch (e) {
        errorMsg.textContent = 'API-Kommunikationsfehler: ' + e.message;
    }
}

async function handleDelete(e) {
    e.preventDefault();

    if (!confirm('Bist du dir wirklich sicher, dass du diesen User unwiderruflich löschen möchtest?')) {
        return;
    }

    clearMessages();

    try {
        const sessions = await api.get('/ajax/sessions.php', { user_id: userId });
        for (const session of sessions.data ?? []) {
            await api.post('/ajax/sessions/delete.php', { id: session.session_id });
        }

        for (const membership of memberships) {
            await api.post('/ajax/group-members/delete.php', {
                user_id:  membership.user_id,
                group_id: membership.group_id,
            });
        }

        const grantedVisibilities = await api.get('/ajax/track-visible-users.php', { user_id: userId });
        for (const visibility of grantedVisibilities.data ?? []) {
            await api.post('/ajax/track-visible-users/delete.php', visibility);
        }

        const ownedTracks = await api.get('/ajax/routes.php', { owner_user_id: userId });
        for (const track of ownedTracks.data ?? []) {
            const trackId = track.route_id;

            const userVis = await api.get('/ajax/track-visible-users.php', { track_id: trackId });
            for (const visibility of userVis.data ?? []) {
                await api.post('/ajax/track-visible-users/delete.php', visibility);
            }

            const groupVis = await api.get('/ajax/track-visible-groups.php', { track_id: trackId });
            for (const visibility of groupVis.data ?? []) {
                await api.post('/ajax/track-visible-groups/delete.php', visibility);
            }

            await api.post('/ajax/routes/delete.php', { id: trackId });
        }

        const deletion = await api.post('/ajax/users/delete.php', { id: userId });

        if (deletion.success) {
            window.location.href = 'adminpanel.html?msg=deleted';
        } else {
            errorMsg.textContent = 'Löschung fehlgeschlagen: ' + (deletion.error ?? 'Unbekannter Fehler.');
        }
    } catch (e) {
        errorMsg.textContent = 'API-Kommunikationsfehler: ' + e.message;
    }
}

function clearMessages() {
    successMsg.textContent = '';
    errorMsg.textContent   = '';
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>

</body>
</html>
