    <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">

        <!-- Logo / Icon -->
        <div class="text-center mb-4">
          <h1 class="login-title">Willkommen</h1>
          <p class="login-subtitle">Always drive save</p>

        <!-- Formular -->
        <form action="http://localhost/pacenote24/public/login-logic.php" method="post">
          <!-- Benutzer -->
          <div class="mb-3">
            <label for="login" class="form-label">Benutername</label>
            <input
              type="text"
              class="form-control"
              id="login"
              name="email"
              placeholder="IchRaseNicht24"
              required
            />
          </div>

          <!-- Passwort -->
          <div class="mb-3">
            <label for="pass" class="form-label">

              <a href="#" class="forgot-link float-end"> Vergessen?</a>
            </label>
            <input
              class="form-control"
              id="password"
              name="pass"
              type="password"
              placeholder="••••••••"
              required
            />
          </div>

          <!-- Login Button -->
          <button type="submit" class="btn btn-primary login-btn w-100 mb-3">
            Anmelden
          </button>

          <!-- Trennlinie -->
          <div class="divider d-flex align-items-center my-3">
            <span></span>
            <p class="mx-3 mb-0">oder</p>
            <span></span>
          </div>

          <!-- Registrieren -->
          <p class="text-center mb-0 register-text">

            <a href="#" class="register-link">Jetzt registrieren</a>

      </div>
